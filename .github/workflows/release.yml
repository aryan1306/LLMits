name: Build DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the app (for example, 1.0.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package universal macOS app
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test
        run: swift test

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "value=$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DMG
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
          IS_TAG_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Releases must keep the same signing identity, or users lose Keychain trust on update.
          if [[ "$IS_TAG_RELEASE" == "true" ]]; then
            : "${CODESIGN_P12_BASE64:?Set the CODESIGN_P12_BASE64 repository secret}"
            : "${CODESIGN_P12_PASSWORD:?Set the CODESIGN_P12_PASSWORD repository secret}"
          fi
          ./scripts/build-dmg.sh "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMits-${{ steps.version.outputs.value }}
          path: |
            dist/LLMits.dmg
            dist/LLMits.dmg.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/LLMits.dmg dist/LLMits.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/LLMits.dmg dist/LLMits.dmg.sha256 --generate-notes --title "LLMits $GITHUB_REF_NAME"
          fi

      - name: Mirror release to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${AWS_ACCESS_KEY_ID:?Set the R2_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the R2_SECRET_ACCESS_KEY repository secret}"
          : "${R2_BUCKET_NAME:?Set the R2_BUCKET_NAME repository variable}"

          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          endpoint_url="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"

          upload() {
            local source="$1"
            local key="$2"
            local cache_control="$3"
            local content_type="$4"
            aws s3 cp "$source" "s3://$R2_BUCKET_NAME/$key" \
              --endpoint-url "$endpoint_url" \
              --content-type "$content_type" \
              --content-disposition "attachment; filename=$(basename "$source")" \
              --cache-control "$cache_control" \
              --no-progress
          }

          release_tag="v$RELEASE_VERSION"
          for asset in LLMits.dmg LLMits.dmg.sha256; do
            if [[ "$asset" == *.dmg ]]; then
              content_type="application/x-apple-diskimage"
            else
              content_type="text/plain; charset=utf-8"
            fi
            upload "dist/$asset" "releases/$release_tag/$asset" \
              "public, max-age=31536000, immutable" "$content_type"
          done

          printf '%s' "$release_tag" > dist/version.txt
          upload dist/version.txt latest/version.txt \
            "no-cache" "text/plain; charset=utf-8"
