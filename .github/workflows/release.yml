name: Build DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the app (for example, 1.0.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package universal macOS app
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test
        run: swift test

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "value=$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DMG
        run: ./scripts/build-dmg.sh "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMits-${{ steps.version.outputs.value }}
          path: |
            dist/LLMits.dmg
            dist/LLMits.dmg.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/LLMits.dmg dist/LLMits.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/LLMits.dmg dist/LLMits.dmg.sha256 --generate-notes --title "LLMits $GITHUB_REF_NAME"
          fi

      - name: Mirror release to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"
          : "${R2_BUCKET_NAME:?Set the R2_BUCKET_NAME repository variable}"

          upload() {
            local source="$1"
            local key="$2"
            local cache_control="$3"
            local content_type="$4"
            npx --yes wrangler@4 r2 object put "$R2_BUCKET_NAME/$key" \
              --file "$source" \
              --content-type "$content_type" \
              --content-disposition "attachment; filename=$(basename "$source")" \
              --cache-control "$cache_control" \
              --remote
          }

          release_tag="v$RELEASE_VERSION"
          for asset in LLMits.dmg LLMits.dmg.sha256; do
            if [[ "$asset" == *.dmg ]]; then
              content_type="application/x-apple-diskimage"
            else
              content_type="text/plain; charset=utf-8"
            fi
            upload "dist/$asset" "releases/$release_tag/$asset" \
              "public, max-age=31536000, immutable" "$content_type"
          done

          printf '%s' "$release_tag" > dist/version.txt
          upload dist/version.txt latest/version.txt \
            "no-cache" "text/plain; charset=utf-8"
